<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Behind private access the manifest fetch needs cookies, or it lands on the login redirect. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ebe7e4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131a24" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piano</title>
    <!-- next-themes applies the theme only once React runs, after the first paint; a page painted
         light would then fade to dark on every load. Apply its stored choice before that paint. -->
    <script>
      // Entrance motion is for changes after load; main.tsx clears this a beat after startup.
      document.documentElement.dataset.loading = "";
      try {
        const stored = localStorage.getItem("theme");
        const dark = stored === "dark" || (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
