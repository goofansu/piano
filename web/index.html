<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Behind private access the manifest fetch needs cookies, or it lands on the login redirect. -->
    <link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#ebe7e4" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#131a24" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Piano</title>
    <!-- next-themes applies the theme only once React runs, after the first paint; a page painted
         light would then fade to dark on every load. Apply its stored choice before that paint.
         Every key this browser keeps is `piano.<name>`: a choice saved under a former name is
         carried to today's once, here, before anything reads it, and the former key removed. -->
    <script>
      try {
        for (const [former, key] of [
          ["theme", "piano.theme"],
          ["piano:messages-only", "piano.messagesOnly"],
          ["piano:changes-wrap", "piano.codeWrap"],
        ]) {
          const saved = localStorage.getItem(former);
          if (saved === null) continue;
          if (localStorage.getItem(key) === null) localStorage.setItem(key, saved);
          localStorage.removeItem(former);
        }
        // Read by nothing since Messages only replaced it.
        localStorage.removeItem("piano:session-display");
        const stored = localStorage.getItem("piano.theme");
        const dark = stored === "dark" || (stored !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.add(dark ? "dark" : "light");
        document.documentElement.style.colorScheme = dark ? "dark" : "light";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
