name: Quality

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality gates
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      # The module suite includes a real Worktrunk lifecycle test, not just fake CLI tests.
      # Piano supports the latest Worktrunk, so CI tests the latest release, checked against
      # the checksum file published with it.
      - name: Install the latest Worktrunk
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          asset=worktrunk-x86_64-unknown-linux-musl.tar.xz
          for file in "$asset" "$asset.sha256"; do
            curl --fail --location --silent --show-error --retry 3 --remote-name \
              "https://github.com/max-sixty/worktrunk/releases/latest/download/$file"
          done
          sha256sum --check "$asset.sha256"
          mkdir -p worktrunk
          tar -xJf "$asset" --strip-components=1 -C worktrunk
          echo "$RUNNER_TEMP/worktrunk" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/worktrunk/wt" --version
      - name: Clean install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # biome check also enforces the formatter; do not run auto-fixes in CI.
      - name: Lint and formatting
        run: npm run lint
      - name: Test (fake Pi, no model credentials)
        run: npm test
      - name: Build
        run: npm run build

  browser:
    name: Critical paths
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Install agent-browser 0.38.1 and its browser
        run: |
          npm install --global agent-browser@0.38.1
          agent-browser install --with-deps
      # A scratch Piano with a fake Pi: no model credentials, no paid calls.
      - name: Browser journeys
        run: npm run test:browser
      - name: Keep journey screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: critical-path-screenshots
          path: .scratch/browser
          if-no-files-found: ignore
