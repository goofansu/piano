name: Quality

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # oxlint (including layer boundaries), stylelint, then oxfmt --check; no auto-fixes.
      - name: Lint and formatting
        run: npm run lint

  # Advisory: lists skipped and net-removed tests for review; never fails the gate.
  test-changes:
    name: Test changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history so the merge base with origin/main exists.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
      - name: Report test changes since origin/main
        run: node scripts/test-changes.mjs

  # Its own runner: the build is the longest static step and needs nothing from the others.
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Build
        run: npm run build

  tests:
    name: Module tests (${{ matrix.shard }}/8)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # Finish every shard even when another fails, retaining the full suite's evidence.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Clean install
        run: npm ci
      # Same preload and file glob as npm test. Node partitions all files across the shards;
      # keep options before the glob (npm test -- --test-shard=... would not shard).
      - name: Test (fake Pi, no model credentials)
        run: node --test --test-shard=${{ matrix.shard }}/8 --import ./test/setup.ts 'test/**/*.test.ts' 'features/*/test/**/*.test.ts'

  # Preserve the existing required-check name. A skipped/cancelled/failed dependency must
  # never turn into a passing (or skipped) gate, including a failure in just one matrix leg.
  quality:
    name: Quality gates
    needs: [checks, build, tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every quality check
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$BUILD_RESULT" = success
          test "$TESTS_RESULT" = success

  browser:
    name: Critical paths (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: open-session + transcript-rows
            first: open-session
            second: transcript-rows
          - name: start-session + session-sharing
            first: start-session
            second: session-sharing
          - name: voice-input
            first: voice-input
            second: ''
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Install agent-browser 0.43.0 and its browser
        id: browser-install
        run: |
          npm install --global agent-browser@0.43.0
          agent-browser install
      # A scratch Piano with a fake Pi: no model credentials, no paid calls.
      - name: Browser journey (${{ matrix.first }})
        run: node test/browser/${{ matrix.first }}.mjs
      - name: Browser journey (${{ matrix.second || 'none in this job' }})
        if: ${{ !cancelled() && steps.browser-install.outcome == 'success' && matrix.second != '' }}
        run: node test/browser/${{ matrix.second }}.mjs
      - name: Keep journey screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: critical-path-screenshots-${{ matrix.first }}
          path: .scratch/browser
          if-no-files-found: ignore
