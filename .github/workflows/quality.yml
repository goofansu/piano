name: Quality

on:
  pull_request:
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      # oxlint, stylelint, then oxfmt --check; do not run auto-fixes in CI.
      - name: Lint and formatting
        run: npm run lint
      - name: Build
        run: npm run build

  tests:
    name: Module tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      WORKTRUNK_VERSION: v0.81.0
    strategy:
      # Finish every shard even when another fails, retaining the full suite's evidence.
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      # The module suite includes a real Worktrunk lifecycle test, not just fake CLI tests.
      # CI tests one pinned release, checked against the checksum file published with it;
      # bump WORKTRUNK_VERSION to move CI to a new release. The binary is cached per
      # version: release downloads have returned 504 for an hour at a time.
      - name: Restore Worktrunk
        id: worktrunk-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/worktrunk
          key: worktrunk-x86_64-unknown-linux-musl-${{ env.WORKTRUNK_VERSION }}
      - name: Download Worktrunk
        if: steps.worktrunk-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          cd "$RUNNER_TEMP"
          asset=worktrunk-x86_64-unknown-linux-musl.tar.xz
          for file in "$asset" "$asset.sha256"; do
            curl --fail --location --silent --show-error --remote-name \
              --retry 8 --retry-all-errors --retry-max-time 300 \
              "https://github.com/max-sixty/worktrunk/releases/download/$WORKTRUNK_VERSION/$file"
          done
          sha256sum --check "$asset.sha256"
          mkdir -p worktrunk
          tar -xJf "$asset" --strip-components=1 -C worktrunk
      - name: Put Worktrunk on PATH
        shell: bash
        run: |
          echo "$RUNNER_TEMP/worktrunk" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/worktrunk/wt" --version
      - name: Clean install
        run: npm ci
      # Same preload and file glob as npm test. Node partitions all files across the shards;
      # keep options before the glob (npm test -- --test-shard=... would not shard).
      - name: Test (fake Pi, no model credentials)
        run: node --test --test-shard=${{ matrix.shard }}/4 --import ./test/setup.ts 'test/**/*.test.ts'

  # Preserve the existing required-check name. A skipped/cancelled/failed dependency must
  # never turn into a passing (or skipped) gate, including a failure in just one matrix leg.
  quality:
    name: Quality gates
    needs: [checks, tests]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 1
    steps:
      - name: Require every quality check
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          test "$CHECKS_RESULT" = success
          test "$TESTS_RESULT" = success

  browser:
    name: Critical paths
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Clean install
        run: npm ci
      - name: Install agent-browser 0.41.2 and its browser
        run: |
          npm install --global agent-browser@0.41.2
          agent-browser install
      # A scratch Piano with a fake Pi: no model credentials, no paid calls.
      - name: Browser journeys
        run: npm run test:browser
      - name: Keep journey screenshots
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: critical-path-screenshots
          path: .scratch/browser
          if-no-files-found: ignore
